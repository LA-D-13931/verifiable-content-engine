name: 引擎套件（本仓库）

# 第五十二轮拆 CI：**本 workflow 只引用本仓库内的路径** ✓
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依赖（puppeteer-core 等）
        run: cd apps/linalg-lab && npm install --no-audit --no-fund
      - name: 引擎套件 --all
        run: cd apps/linalg-lab && python3 tools/verify-all.py --all
