name: 引擎套件（本仓库）

# 第五十二轮拆 CI：**本 workflow 只引用本仓库内的路径** ✓
# 第五十五轮：**认识退出码 2 = 带标注通过**（"环境不足"不是失败 ✓，但也**不是绿** ✗）——
#   0 → 绿 ✓ ｜ 2 → 通过但**必须把"有 N 条没条件比"打印出来** ✓ ｜ 1/3 → 红 ✗
#   **并且**：输出里出现「未选择」⇒ 一律判失败 ✗（那是"该跑的没跑" ✓，与"环境不足"不同 ✓）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依赖（puppeteer-core 等）
        run: cd apps/linalg-lab && npm install --no-audit --no-fund
      - name: 引擎套件 --all（退出码 2 = 带标注通过）
        run: |
          set +e
          cd apps/linalg-lab
          python3 tools/verify-all.py --all 2>&1 | tee /tmp/suite.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "---- 退出口径 ----"
          # ⚠️ 第五十五轮自伤：我第一版写的是 grep -q "未选择" ✗ —— 而套件的**图例行**里
          # 永远有「未选择（我没要求跑）」字样 ⇒ 那一版**必然判失败** ✗（这正是"文案判据"那一族 ✓）。
          # 真判据：只看**汇总里的计数**「另有 N 项未选择」，且 N > 0 才算失败 ✓。
          if grep -qE "另有 [1-9][0-9]* 项未选择|[1-9][0-9]* 项未选择（见上）" /tmp/suite.log; then
            echo "❌ 汇总显示有未选择项 ⇒ 该跑的没跑 ⇒ 判失败"
            exit 1
          fi
          echo "✓ 未选择项 = 0（图例里的字样不算 ✓）"
          case "$rc" in
            0) echo "✅ 套件全绿（退出码 0）"; exit 0;;
            2) echo "⚠️ **带标注通过**：本次有环境不足项（退出码 2）—— 不是绿 ✗，逐条见上面「没条件比」"; exit 0;;
            *) echo "❌ 套件失败（退出码 $rc）—— 1=内容/比对不符 ｜ 3=检查器故障"; exit "$rc";;
          esac
