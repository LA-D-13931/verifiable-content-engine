name: 引擎套件（本仓库）

# 第五十二轮：拆 CI（本 workflow 只引用本仓库路径 ✓）
# 第五十六轮：**自证** —— 失败原因不必再靠下载日志 ✓
#   套件步只"跑 + 留证"（不判成败）✓；**判成败搬进 always() 的汇总步** ✓，
#   而那段逻辑在 tools/ci-judge.sh 里（**本机可重放** ✓）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依赖（puppeteer-core 等）
        run: cd apps/linalg-lab && npm install --no-audit --no-fund
      - name: 引擎套件 --all（只跑 + 留证；判成败在下一步）
        id: suite
        run: |
          set +e
          cd apps/linalg-lab
          # ① stdout / stderr **分开留**（合并流分不清"谁说的" ✗）
          python3 tools/verify-all.py --all >/tmp/suite.out 2>/tmp/suite.err
          echo "rc=$?" >/tmp/suite.rc
          # ② **环境事实**（CI 与本机的差异只有它能量出来）
          {
            echo "## 环境事实"
            echo '```'
            echo "python: $(python3 -V 2>&1)"
            echo "node:   $(node -v 2>&1) ｜ npm: $(npm -v 2>&1)"
            echo "cwd:    $(pwd)"
            echo "node_modules 在: $([ -d node_modules ] && echo 是 || echo 否)"
            echo "浏览器: $(command -v chromium chromium-browser google-chrome 2>/dev/null || echo '无')"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit 0      # ← 本步**不判成败** ✓
      - name: 汇总（always()：这一步必跑，结论自带原因）
        if: always()
        run: bash apps/linalg-lab/tools/ci-judge.sh
