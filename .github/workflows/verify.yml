# 引擎自检的护栏：任何 push / PR 都跑一遍离线自检。
#
# 为什么只跑离线项：需要 Chromium / 主站快照 / 主题 token 的那几项在这里是「环境不足」，
# 不算通过也不算失败（见 verify-all.py 的三态契约）。**不写死项数**——它会随套件变化失真。
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 离线自检（零第三方依赖）
        run: python3 apps/linalg-lab/tools/verify-all.py
