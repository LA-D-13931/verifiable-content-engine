name: 引擎套件（本仓库）

# 第五十二轮：拆 CI（本 workflow 只引用本仓库路径 ✓）
# 第五十六轮：**自证** —— 失败原因不必再靠下载日志 ✓
#   套件步只"跑 + 留证"（不判成败）✓；**判成败搬进 always() 的汇总步** ✓，
#   而那段逻辑在 tools/ci-judge.sh 里（**本机可重放** ✓）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          # ⚠️ 第五十七轮：**ci 的 Python 版本必须与生成物一致** ✗ ——
          # engine-core/mat-vectors.json 里的 signature 是 **AST 指纹**（ast.dump 的哈希 ✓），
          # 而 ast.dump 的输出**跨 Python 版本会变** ✗ ⇒ 3.12 上算出来的指纹与记录值不等 ⇒
          # 报「mat.py 的数学已变更，但测试向量未重新生成」✗（内容其实一个字没改 ✓）。
          # 这是**环境适配**，不是判据改动 ✓（判据一个字没动 ✓）。
          python-version: '3.13'
      - name: 依赖（puppeteer-core 等）
        run: cd apps/linalg-lab && npm install --no-audit --no-fund
      - name: 引擎套件 --all（只跑 + 留证；判成败在下一步）
        id: suite
        run: |
          set +e
          cd apps/linalg-lab
          # ① stdout / stderr **分开留**（合并流分不清"谁说的" ✗）
          python3 tools/verify-all.py --all >/tmp/suite.out 2>/tmp/suite.err
          echo "rc=$?" >/tmp/suite.rc
          # ② **环境事实**（CI 与本机的差异只有它能量出来）
          {
            echo "## 环境事实"
            echo '```'
            echo "python: $(python3 -V 2>&1)"
            echo "node:   $(node -v 2>&1) ｜ npm: $(npm -v 2>&1)"
            echo "cwd:    $(pwd)"
            echo "node_modules 在: $([ -d node_modules ] && echo 是 || echo 否)"
            echo "浏览器: $(command -v chromium chromium-browser google-chrome 2>/dev/null || echo '无')"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit 0      # ← 本步**不判成败** ✓
      - name: 汇总（always()：这一步必跑，结论自带原因）
        if: always()
        run: bash apps/linalg-lab/tools/ci-judge.sh
      - name: 留证（artifact：让 agent 也读得到原因）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-evidence
          # ⚠️ if-no-files-found: warn —— **读不到文件本身也是情报** ✓（说明套件步没写成 ✓），
          #    所以不设成 error ✗（那会把"没写成"和"跑失败"混成一件事 ✓）。
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/suite.out
            /tmp/suite.err
            /tmp/suite.rc
            /tmp/suite-summary.md

      # P7（第八十一轮）：artifact 的 zip 在 agent 侧下载不到（三次都失败）⇒ 绕过去比修它划算：
      # 把 Summary 同时写进仓库内的文件（ci-logs/），并 cat 进 step 日志。
      - name: 汇总落文件（P7 · 让 agent 也读得到 Summary）
        if: always()
        run: |
          mkdir -p ci-logs
          S="$GITHUB_STEP_SUMMARY"
          if [ -n "$S" ] && [ -f "$S" ]; then cp "$S" "ci-logs/summary-${{ github.run_number }}.md"; \
          else echo '（本步没有 summary 文件 ⇒ 如实写缺口）' > "ci-logs/summary-${{ github.run_number }}.md"; fi
          cat "ci-logs/summary-${{ github.run_number }}.md"
      - name: 提交 Summary（agent 用普通 git 就能读）
        if: always()
        run: |
          git config user.name ci-bot; git config user.email ci@local
          git add ci-logs/ 2>/dev/null || true
          git commit -m 'CI: summary for run ${{ github.run_number }} (P7)' 2>/dev/null || echo no-change
          git push 2>/dev/null || echo 'push 失败 ⇒ 至少 step 日志里有全文'
