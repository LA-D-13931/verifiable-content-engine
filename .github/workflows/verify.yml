# 引擎自检的护栏：任何 push / PR 都跑一遍离线自检。
#
# 为什么只跑离线项：19 项里 4 项需要 puppeteer-core + 一个 Chromium，1 项需要兄弟站点的
# 主站快照；那 5 项在 CI 里是「环境不足」，不算通过也不算失败（见 verify-all.py 的三态契约）。
# 离线项零第三方依赖，只需 python3 + node，所以这条 CI 是廉价且稳定的。
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 离线自检（零第三方依赖）
        run: python3 apps/linalg-lab/tools/verify-all.py
